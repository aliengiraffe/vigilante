version: "3"

vars:
  LOCAL_BIN_DIR: "{{.HOME}}/.local/bin"
  INSTALL_PATH: "{{.LOCAL_BIN_DIR}}/vigilante"

tasks:
  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  coverage:
    desc: Run the test suite with coverage and enforce the committed threshold
    # Delegates to the script so this and CI cannot measure differently. The
    # threshold lives in scripts/coverage-threshold.
    cmds:
      - ./scripts/coverage.sh

  build:
    desc: Build the repo-local vigilante binary
    cmds:
      - go build -o ./vigilante ./cmd/vigilante

  install:
    desc: Install the built binary into ~/.local/bin
    deps: [build]
    # Atomic write-and-rename, not `cp`. Overwriting the destination in place
    # corrupts the binary for every later exec when a daemon is running from it.
    # See scripts/install-binary.sh.
    cmds:
      - ./scripts/install-binary.sh ./vigilante "{{.INSTALL_PATH}}"

  setup:
    desc: Run setup with the repo-local binary
    deps: [build]
    cmds:
      - ./vigilante setup

  install-setup:
    desc: Run setup with the installed local binary
    deps: [install]
    cmds:
      - '{{.INSTALL_PATH}} setup'

  setup-daemon:
    desc: Refresh the installed daemon or service definition
    deps: [install]
    cmds:
      - ./scripts/setup-daemon.sh

  sandbox-image:
    desc: Build the vigilante-sandbox Docker image
    cmds:
      - docker build -t vigilante-sandbox:latest .
