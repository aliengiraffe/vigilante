name: CI

on:
  pull_request:
  # Codecov needs a base commit on the default branch to diff pull requests
  # against. Without a `main` run, every PR comparison is against nothing and the
  # patch status is meaningless.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are disposable, but a cancelled `main` run leaves Codecov
  # without a base report for that commit, so let pushes finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect Markdown-only pull request
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only pull requests have a base/head pair to diff. On a push to main
          # these are empty, and an empty diff would look Markdown-only and skip
          # every Go step — including the coverage upload Codecov needs.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "markdown_only=false" >> "$GITHUB_OUTPUT"
            echo "Event is $EVENT_NAME, not a pull request; running full CI."
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "markdown_only=false" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running full CI."
            exit 0
          fi

          markdown_only=true
          for path in "${changed_files[@]}"; do
            case "$path" in
              *.md) ;;
              *)
                markdown_only=false
                break
                ;;
            esac
          done

          echo "Changed files:"
          printf '%s\n' "${changed_files[@]}"
          echo "markdown_only=$markdown_only" >> "$GITHUB_OUTPUT"

          if [ "$markdown_only" = true ]; then
            echo "Markdown-only pull request detected; full CI steps will be skipped."
          fi

      - name: Set up Go
        if: steps.changes.outputs.markdown_only != 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up GoReleaser
        if: steps.changes.outputs.markdown_only != 'true'
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7
        with:
          install-only: true

      - name: Check formatting
        if: steps.changes.outputs.markdown_only != 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint with go vet
        if: steps.changes.outputs.markdown_only != 'true'
        run: go vet ./...

      - name: Lint with golangci-lint
        if: steps.changes.outputs.markdown_only != 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Run tests with coverage
        if: steps.changes.outputs.markdown_only != 'true'
        # Same script `task coverage` runs, so the enforced threshold and the
        # reported number cannot drift between local and CI.
        run: ./scripts/coverage.sh

      - name: Upload coverage to Codecov
        if: steps.changes.outputs.markdown_only != 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          disable_search: true
          slug: ${{ github.repository }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # A missing or expired upload token must not fail the build. Coverage
          # is already enforced locally by scripts/coverage.sh; Codecov is the
          # public report awesome-go asks for, not the gate.
          fail_ci_if_error: false

      - name: Verify build
        if: steps.changes.outputs.markdown_only != 'true'
        run: go build ./...

      - name: Validate GoReleaser config
        if: steps.changes.outputs.markdown_only != 'true'
        run: goreleaser check

      - name: Skip full CI for Markdown-only pull requests
        if: steps.changes.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed, so full CI was skipped intentionally."
