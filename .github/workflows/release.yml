name: Release

# Builds, signs, and notarizes the macOS binaries with GoReleaser, then publishes
# the GitHub release and the Homebrew cask, and finally repackages the released
# binaries into prebuilt npm packages (see the npm job below).
#
# Runs on macOS because signing needs Apple's native codesign/notarytool. The
# Linux artifacts cross-compile from the same runner (everything is
# CGO_ENABLED=0); GoReleaser OSS cannot split a release across runners.
#
# Signing happens in a `builds` post hook (scripts/sign-macos-binary.sh), which
# signs, verifies, EXECUTES, and notarizes each macOS artifact before the archive
# is built and before anything is published. See docs/releasing.md.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    environment: main
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Verify tag policy
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must use the format v{x}.{y}.{z}."
            exit 1
          fi

          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release tags must point to a commit already merged into main."
            exit 1
          fi

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Get token for Homebrew tap
        uses: actions/create-github-app-token@v3
        id: tap_token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-spaceship

      # Import the Developer ID Application certificate into a throwaway keychain
      # before GoReleaser runs. `codesign` needs a real keychain identity; the
      # keychain is scoped to this runner and discarded with it.
      - name: Import Apple Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: bash ./scripts/import-signing-certificate.sh

      # The build post hook signs, verifies, executes, and notarizes each macOS
      # artifact. A binary that cannot run aborts the release before publish.
      - name: Build and publish GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.tap_token.outputs.token }}
          OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
          OTEL_TOKEN: ${{ secrets.OTEL_TOKEN }}
          OTEL_URL_PATH: ${{ secrets.OTEL_URL_PATH }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ vars.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_NOTARY_API_KEY_P8_BASE64:-}" ]; then
            printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
            export APPLE_NOTARY_KEY_P8="$RUNNER_TEMP/notary.p8"
            export APPLE_NOTARY_KEY_ID="$APPLE_NOTARY_API_KEY_ID"
            export APPLE_NOTARY_ISSUER_ID="$APPLE_NOTARY_API_ISSUER_ID"
          else
            echo "::warning::Apple notary credentials are not configured; the release will be signed but NOT notarized."
          fi
          goreleaser release --clean

  # Repackages the already-published release archives into npm packages
  # (packaging/npm/). Runs after `release`, so the GitHub release and the
  # Homebrew cask are live before npm is attempted: an npm-registry outage
  # degrades to "this version is missing from npm" instead of blocking a
  # signed release, while a failed publish still fails the workflow loudly.
  #
  # The Go binary is NEVER rebuilt here — a rebuild would be unsigned, not
  # notarized, and would lack the ldflags version stamp and telemetry
  # configuration. This job only needs to download, repackage, and upload, so
  # it runs on ubuntu-latest with no Apple or OTEL secrets.
  npm:
    needs: release
    runs-on: ubuntu-latest
    environment: main
    timeout-minutes: 15
    permissions:
      contents: read
      # npm provenance (Sigstore attestation of this workflow run) needs
      # OIDC. Publishing itself still authenticates with NPM_TOKEN below.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'vigilante_*.tar.gz' --dir release-archives

      - name: Stage npm packages from released archives
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node packaging/npm/build_packages.js \
            --version "${TAG_NAME#v}" \
            --archives release-archives

      # The pre-publish gate: exact os/cpu per platform package, the binary
      # present with the executable bit, no stray files or install scripts in
      # a platform package, and optionalDependencies pinned to this version.
      # A platform package silently missing its os/cpu fields is the worst
      # regression here — npm would install it on every platform.
      - name: Verify npm package contents
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node packaging/npm/check_packages.js --version "${TAG_NAME#v}"

      # Platform packages first, then the main package: the main package's
      # optionalDependencies reference these exact versions, so publishing it
      # first would let a freshly-published main package resolve to a
      # missing platform package.
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in vigilante-cli-darwin-arm64 vigilante-cli-darwin-x64 vigilante-cli-linux-x64; do
            npm publish --provenance --access public "packaging/npm/$pkg"
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public packaging/npm/vigilante-cli
