name: Release

# Builds, signs, and notarizes the macOS binaries with GoReleaser, then publishes
# the GitHub release and the Homebrew cask, and finally repackages the released
# binaries into prebuilt PyPI wheels (see the pypi job below).
#
# Runs on macOS because signing needs Apple's native codesign/notarytool. The
# Linux artifacts cross-compile from the same runner (everything is
# CGO_ENABLED=0); GoReleaser OSS cannot split a release across runners.
#
# Signing happens in a `builds` post hook (scripts/sign-macos-binary.sh), which
# signs, verifies, EXECUTES, and notarizes each macOS artifact before the archive
# is built and before anything is published. See docs/releasing.md.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    environment: main
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Verify tag policy
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must use the format v{x}.{y}.{z}."
            exit 1
          fi

          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release tags must point to a commit already merged into main."
            exit 1
          fi

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Get token for Homebrew tap
        uses: actions/create-github-app-token@v3
        id: tap_token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-spaceship

      # Import the Developer ID Application certificate into a throwaway keychain
      # before GoReleaser runs. `codesign` needs a real keychain identity; the
      # keychain is scoped to this runner and discarded with it.
      - name: Import Apple Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: bash ./scripts/import-signing-certificate.sh

      # The build post hook signs, verifies, executes, and notarizes each macOS
      # artifact. A binary that cannot run aborts the release before publish.
      - name: Build and publish GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.tap_token.outputs.token }}
          OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
          OTEL_TOKEN: ${{ secrets.OTEL_TOKEN }}
          OTEL_URL_PATH: ${{ secrets.OTEL_URL_PATH }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ vars.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_NOTARY_API_KEY_P8_BASE64:-}" ]; then
            printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
            export APPLE_NOTARY_KEY_P8="$RUNNER_TEMP/notary.p8"
            export APPLE_NOTARY_KEY_ID="$APPLE_NOTARY_API_KEY_ID"
            export APPLE_NOTARY_ISSUER_ID="$APPLE_NOTARY_API_ISSUER_ID"
          else
            echo "::warning::Apple notary credentials are not configured; the release will be signed but NOT notarized."
          fi
          goreleaser release --clean

  # Repackages the already-published release archives into PyPI wheels
  # (packaging/pypi/). Runs after `release`, so the GitHub release and the
  # Homebrew cask are live before PyPI is attempted: a PyPI outage degrades to
  # "this version is missing from PyPI" instead of blocking a signed release,
  # while a failed upload still fails the workflow loudly.
  #
  # The Go binary is NEVER rebuilt here — a rebuild would be unsigned, not
  # notarized, and would lack the ldflags version stamp and telemetry
  # configuration. This job only needs to download, repackage, and upload, so
  # it runs on ubuntu-latest with no Apple or OTEL secrets.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: main
    timeout-minutes: 15
    permissions:
      contents: read
      # PyPI Trusted Publishing (OIDC). The trusted publisher on PyPI is
      # scoped to this repository, this workflow file, and the `main`
      # environment — see docs/releasing.md.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'vigilante_*.tar.gz' --dir release-archives

      - name: Build wheels and sdist from released archives
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade build
          python packaging/pypi/build_wheels.py \
            --version "${TAG_NAME#v}" \
            --archives release-archives \
            --out packaging/pypi/dist

      # The pre-upload gate: exact py3-none-<platform> tags, the binary under
      # <dist>.data/scripts/ with the executable bit, zero .py files, and
      # Root-Is-Purelib: false. A wheel that silently reverted to
      # py3-none-any would install a non-functional binary on every platform.
      - name: Verify wheel and sdist contents
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python packaging/pypi/check_wheel.py \
            --dist packaging/pypi/dist \
            --version "${TAG_NAME#v}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packaging/pypi/dist
